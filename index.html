<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GEDRA | Topografía Profesional</title>
    
    <meta name="theme-color" content="#1a2b3c">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="GEDRA.jpg">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Pantalla de Carga */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
            transition: opacity 0.5s ease;
        }
        .logo-anim { max-width: 180px; animation: breathe 3s infinite ease-in-out; }
        @keyframes breathe { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.05); opacity: 1; } }
        
        /* Navegación por Vistas */
        .view { display: none; }
        .view.active { display: block; animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .font-mono-topo { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
</head>
<body class="bg-slate-100 text-slate-900 font-sans">

    <div id="splash-screen">
        <img src="GEDRA.jpg" alt="GEDRA" class="logo-anim">
        <p class="mt-4 text-[10px] tracking-[0.5em] text-slate-400 font-bold uppercase">Gedra Precisión</p>
    </div>

    <main class="max-w-2xl mx-auto min-h-screen bg-white shadow-2xl flex flex-col relative">
        
        <nav class="bg-[#1a2b3c] p-4 text-white flex justify-between items-center sticky top-0 z-40">
            <div class="flex items-center gap-2">
                <img src="GEDRA.jpg" class="w-8 h-8 rounded-full border border-white/20">
                <span class="font-black tracking-tighter">GEDRA</span>
            </div>
            <div id="status-pwa" class="text-[8px] font-bold bg-green-500/20 text-green-400 border border-green-500/50 px-2 py-1 rounded uppercase tracking-widest">Offline Mode</div>
        </nav>

        <div id="view-home" class="view active p-6">
            <h2 class="text-2xl font-black text-[#1a2b3c] mb-6">Proyectos</h2>
            <div class="grid gap-4">
                <button onclick="changeView('view-setup')" class="p-8 bg-slate-50 border-2 border-dashed border-slate-200 rounded-[2rem] flex flex-col items-center hover:bg-slate-100 transition-all">
                    <span class="text-3xl mb-2">➕</span>
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Nuevo Levantamiento</span>
                </button>
                
                <div class="p-6 bg-[#1a2b3c] rounded-[2rem] text-white relative overflow-hidden shadow-lg">
                    <p class="text-[9px] font-bold opacity-40 uppercase mb-1">Último Proyecto</p>
                    <h3 class="text-lg font-bold" id="last-project-name">Poligonal Base</h3>
                    <p class="text-[10px] text-slate-400 mt-1">Cálculo de Proyecciones Activo</p>
                </div>
            </div>
        </div>

        <div id="view-setup" class="view p-6">
            <button onclick="changeView('view-home')" class="text-[10px] font-bold text-slate-400 uppercase mb-4">← Volver</button>
            <h2 class="text-2xl font-black text-[#1a2b3c] mb-6">Parámetros</h2>

            <div class="space-y-5">
                <div>
                    <label class="block text-[9px] font-bold text-slate-400 uppercase mb-2 ml-1">Nombre del Trabajo</label>
                    <input type="text" id="setup-name" placeholder="Ej: Terreno Sur" class="w-full p-4 bg-slate-50 rounded-2xl outline-none ring-1 ring-slate-200 focus:ring-2 focus:ring-[#b5935a]">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[9px] font-bold text-slate-400 uppercase mb-2 ml-1">Unidades</label>
                        <select id="setup-unit" class="w-full p-4 bg-slate-50 rounded-2xl outline-none font-bold text-sm">
                            <option value="m">Metros (m)</option>
                            <option value="ft">Pies (ft)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[9px] font-bold text-slate-400 uppercase mb-2 ml-1">Grado del Equipo</label>
                        <select id="setup-precision" class="w-full p-4 bg-slate-50 rounded-2xl outline-none font-bold text-sm text-[#b5935a]">
                            <option value="1">1" (Alta Precisión)</option>
                            <option value="2">2" (Estándar)</option>
                            <option value="5">5" (Obra Civil)</option>
                        </select>
                    </div>
                </div>

                <div class="p-6 bg-slate-900 rounded-3xl space-y-4">
                    <p class="text-[9px] font-bold text-slate-500 uppercase tracking-widest">Coordenadas de Estación (0,0)</p>
                    <div class="grid grid-cols-2 gap-4">
                        <input type="number" id="setup-x" placeholder="Este (X)" value="1000.000" class="p-3 bg-white/10 rounded-xl text-white font-mono-topo text-sm outline-none ring-1 ring-white/20">
                        <input type="number" id="setup-y" placeholder="Norte (Y)" value="1000.000" class="p-3 bg-white/10 rounded-xl text-white font-mono-topo text-sm outline-none ring-1 ring-white/20">
                    </div>
                </div>

                <button onclick="startSurvey()" class="w-full py-5 bg-[#b5935a] text-white rounded-2xl font-black uppercase tracking-widest shadow-xl active:scale-95 transition-transform">
                    Iniciar Levantamiento
                </button>
            </div>
        </div>

        <div id="view-calc" class="view flex flex-col flex-1">
            <div class="p-4 bg-slate-50 border-b border-slate-100 flex justify-between items-center">
                <h3 id="display-name" class="font-black text-[#1a2b3c] text-xs uppercase truncate">PROYECTO</h3>
                <span id="point-label" class="text-[9px] font-bold bg-[#b5935a] text-white px-2 py-1 rounded">VÉRTICE 1</span>
            </div>

            <div class="p-4 grid grid-cols-2 gap-2">
                <div class="bg-slate-900 p-4 rounded-2xl text-white shadow-inner">
                    <p class="text-[8px] uppercase opacity-40 font-bold mb-1">Superficie (<span class="u-lab">m</span>²)</p>
                    <p id="res-area" class="text-lg font-mono-topo font-bold text-[#b5935a]">0.000</p>
                </div>
                <div class="bg-slate-900 p-4 rounded-2xl text-white shadow-inner">
                    <p class="text-[8px] uppercase opacity-40 font-bold mb-1">Perímetro (<span class="u-lab">m</span>)</p>
                    <p id="res-perim" class="text-lg font-mono-topo font-bold">0.000</p>
                </div>
            </div>

            <div class="px-4 pb-4">
                <div class="grid grid-cols-12 gap-2">
                    <div class="col-span-5 relative">
                        <label class="absolute top-1 left-3 text-[7px] font-bold text-slate-400 uppercase">Azimut (°)</label>
                        <input type="number" id="in-az" step="any" placeholder="00.0000" class="w-full pt-4 pb-2 px-3 bg-slate-50 rounded-xl outline-none ring-1 ring-slate-200 focus:ring-2 focus:ring-[#1a2b3c] font-mono-topo">
                    </div>
                    <div class="col-span-5 relative">
                        <label class="absolute top-1 left-3 text-[7px] font-bold text-slate-400 uppercase">Dist (m)</label>
                        <input type="number" id="in-dist" step="any" placeholder="0.000" class="w-full pt-4 pb-2 px-3 bg-slate-50 rounded-xl outline-none ring-1 ring-slate-200 focus:ring-2 focus:ring-[#1a2b3c] font-mono-topo">
                    </div>
                    <button onclick="addPoint()" class="col-span-2 bg-[#1a2b3c] text-white rounded-xl shadow-lg font-bold text-xl active:scale-90 transition-transform">+</button>
                </div>
            </div>

            <div class="flex-1 overflow-x-auto px-4">
                <table class="w-full text-left border-collapse">
                    <thead class="sticky top-0 bg-white text-[8px] font-bold text-slate-400 uppercase tracking-tighter">
                        <tr class="border-b">
                            <th class="py-2">ID</th>
                            <th class="py-2 text-right">Proj X</th>
                            <th class="py-2 text-right">Proj Y</th>
                            <th class="py-2 text-right text-[#1a2b3c]">Coord X</th>
                            <th class="py-2 text-right text-[#1a2b3c]">Coord Y</th>
                        </tr>
                    </thead>
                    <tbody id="survey-table" class="text-[10px] font-mono-topo"></tbody>
                </table>
            </div>

            <div class="p-4 bg-slate-50 border-t border-slate-100 flex gap-2">
                <button onclick="resetApp()" class="flex-1 py-3 text-[9px] font-bold text-red-400 uppercase tracking-widest">Reiniciar</button>
                <button onclick="exportCSV()" class="flex-1 py-3 bg-[#1a2b3c] text-white rounded-xl text-[9px] font-bold uppercase tracking-widest">Exportar CSV</button>
            </div>
        </div>

        <footer class="p-4 text-center text-[8px] text-slate-300 font-bold uppercase tracking-[0.4em]">
            Precision Engineering by GEDRA © 2026
        </footer>
    </main>

    <script>
        let puntos = [];
        let config = {};

        function changeView(id) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function startSurvey() {
            config = {
                name: document.getElementById('setup-name').value || "Levantamiento",
                unit: document.getElementById('setup-unit').value,
                prec: document.getElementById('setup-precision').value,
                bx: parseFloat(document.getElementById('setup-x').value) || 1000,
                by: parseFloat(document.getElementById('setup-y').value) || 1000
            };
            
            document.getElementById('display-name').innerText = config.name;
            document.querySelectorAll('.u-lab').forEach(el => el.innerText = config.unit);
            
            puntos = [];
            updateUI();
            changeView('view-calc');
        }

        function addPoint() {
            const az = parseFloat(document.getElementById('in-az').value);
            const dist = parseFloat(document.getElementById('in-dist').value);
            if (isNaN(az) || isNaN(dist)) return;

            const rad = az * (Math.PI / 180);
            const px = dist * Math.sin(rad);
            const py = dist * Math.cos(rad);

            const last = puntos.length > 0 ? puntos[puntos.length - 1] : { x: config.bx, y: config.by };
            
            puntos.push({
                id: puntos.length + 1,
                az, dist, px, py,
                x: last.x + px,
                y: last.y + py
            });

            updateUI();
            document.getElementById('in-az').value = '';
            document.getElementById('in-dist').value = '';
            document.getElementById('in-az').focus();
        }

        function updateUI() {
            const table = document.getElementById('survey-table');
            table.innerHTML = `
                <tr class="text-slate-300">
                    <td class="py-2">0</td>
                    <td class="py-2 text-right">--</td>
                    <td class="py-2 text-right">--</td>
                    <td class="py-2 text-right font-bold">${config.bx.toFixed(3)}</td>
                    <td class="py-2 text-right font-bold">${config.by.toFixed(3)}</td>
                </tr>
            ` + puntos.map(p => `
                <tr class="border-b border-slate-50">
                    <td class="py-3 font-bold text-[#b5935a]">${p.id}</td>
                    <td class="py-3 text-right text-slate-400">${p.px.toFixed(3)}</td>
                    <td class="py-3 text-right text-slate-400">${p.py.toFixed(3)}</td>
                    <td class="py-3 text-right font-black">${p.x.toFixed(3)}</td>
                    <td class="py-3 text-right font-black">${p.y.toFixed(3)}</td>
                </tr>
            `).join('');

            // Cálculos de Poligonal
            let area = 0;
            if (puntos.length > 1) {
                const x = [config.bx, ...puntos.map(p => p.x), config.bx];
                const y = [config.by, ...puntos.map(p => p.y), config.by];
                for (let i = 0; i < x.length - 1; i++) {
                    area += (x[i] * y[i+1]) - (x[i+1] * y[i]);
                }
                area = Math.abs(area / 2);
            }
            const perim = puntos.reduce((acc, p) => acc + p.dist, 0);

            document.getElementById('res-area').innerText = area.toFixed(3);
            document.getElementById('res-perim').innerText = perim.toFixed(3);
            document.getElementById('point-label').innerText = `VÉRTICE ${puntos.length + 1}`;
        }

        function exportCSV() {
            let csv = "ID,Azimut,Distancia,ProjX,ProjY,CoordX,CoordY\n";
            csv += `0,0,0,0,0,${config.bx},${config.by}\n`;
            puntos.forEach(p => {
                csv += `${p.id},${p.az},${p.dist},${p.px.toFixed(4)},${p.py.toFixed(4)},${p.x.toFixed(4)},${p.y.toFixed(4)}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `GEDRA_${config.name}.csv`;
            a.click();
        }

        function resetApp() {
            if(confirm("¿Borrar levantamiento actual?")) changeView('view-home');
        }

        // Manejo de Carga
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('splash-screen').style.opacity = '0';
                setTimeout(() => document.getElementById('splash-screen').style.display = 'none', 600);
            }, 2500);
        });

        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
    </script>
</body>
</html>
