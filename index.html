<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GEDRA | Topografía - Construcción con Precisión</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        :root { --primary: #4f46e5; --dark: #0f172a; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; margin: 0; }
        
        /* Splash Screen Animado */
        #splashScreen { transition: opacity 0.8s ease-in-out; }
        .loader-bar { width: 200px; height: 4px; background: #e2e8f0; border-radius: 10px; overflow: hidden; position: relative; }
        .loader-progress { width: 40%; height: 100%; background: var(--primary); position: absolute; animation: loading 1.5s infinite ease-in-out; }
        @keyframes loading { 0% { left: -40%; } 100% { left: 100%; } }

        /* Estilos de Tablas de Ingeniería */
        .topo-table th { background: var(--dark); color: white; font-size: 8px; text-transform: uppercase; padding: 8px 4px; border: 1px solid #1e293b; }
        .topo-table td { text-align: center; border: 1px solid #e2e8f0; padding: 6px 4px; font-size: 10px; font-weight: 600; }
        .tab-scroll::-webkit-scrollbar { height: 6px; }
        .tab-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
    </style>
</head>
<body>

    <div id="splashScreen" class="fixed inset-0 z-[100] bg-white flex flex-col items-center justify-center">
        <img src="image_4da43f.jpg" alt="GEDRA Logo" class="w-64 h-64 object-contain mb-8 animate-pulse">
        <div class="loader-bar"><div class="loader-progress"></div></div>
        <p class="mt-4 text-[10px] font-black text-slate-400 uppercase tracking-[0.3em]">GEDRA Precisión</p>
    </div>

    <div id="projectManager" class="max-w-md mx-auto p-6 pt-12 hidden">
        <header class="mb-10 text-center">
            <h1 class="text-4xl font-extrabold text-indigo-600 tracking-tighter">GEDRA</h1>
            <p class="text-slate-400 text-[9px] font-black uppercase mt-2 tracking-[0.4em]">Construcción con Precisión</p>
        </header>

        <div class="bg-white p-6 rounded-[2.5rem] shadow-xl border border-slate-100 mb-8">
            <input type="text" id="newProjName" placeholder="Nombre del Levantamiento..." class="w-full bg-slate-50 rounded-2xl px-5 py-4 mb-4 outline-none border border-transparent focus:border-indigo-400 font-bold text-sm transition-all">
            <button onclick="createNewProject()" class="w-full bg-indigo-600 text-white font-black py-4 rounded-2xl shadow-lg active:scale-95 transition-transform">NUEVA OBRA</button>
        </div>

        <div id="projectList" class="space-y-3"></div>
    </div>

    <div id="calculatorInterface" class="hidden min-h-screen">
        <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b p-4 flex justify-between items-center">
            <button onclick="exitProject()" class="p-2 bg-slate-100 rounded-xl text-slate-600">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
            </button>
            <span id="activeProjectTitle" class="font-black text-xs uppercase tracking-widest text-slate-800"></span>
            <button onclick="calculate()" class="bg-indigo-600 text-white px-6 py-2 rounded-xl font-black text-[10px] shadow-lg active:scale-95 transition-all">CALCULAR</button>
        </header>

        <main class="p-4 space-y-4 max-w-5xl mx-auto">
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-white p-4 rounded-[2rem] border border-slate-100">
                    <label class="block text-[9px] font-black text-slate-400 uppercase mb-2">Orden de Precisión</label>
                    <select id="order" class="w-full text-[10px] font-bold outline-none bg-slate-50 p-2 rounded-lg">
                        <option value="5000">1:5000 (1er Orden)</option>
                        <option value="2000">1:2000 (2do Orden)</option>
                        <option value="1000" selected>1:1000 (3er Orden)</option>
                    </select>
                </div>
                <div class="bg-white p-4 rounded-[2rem] border border-slate-100">
                    <label class="block text-[9px] font-black text-slate-400 uppercase mb-2">Vértices</label>
                    <input type="number" id="numSides" value="5" class="w-full text-center font-bold text-[10px] bg-slate-50 rounded-lg p-2" onchange="renderInputTable()">
                </div>
            </div>

            <div class="bg-white p-4 rounded-[2.5rem] border border-slate-100 overflow-hidden">
                <h3 class="text-[10px] font-black text-slate-800 uppercase mb-3 ml-2">Datos de Poligonal</h3>
                <div class="overflow-x-auto tab-scroll">
                    <table class="w-full topo-table">
                        <thead><tr><th>Est.</th><th>PV</th><th>Dist. (m)</th><th>Ang. Obs (GMS)</th></tr></thead>
                        <tbody id="inputRows"></tbody>
                    </table>
                </div>
            </div>

            <div id="summaryArea" class="hidden"></div>
            
            <div class="bg-white p-4 rounded-[2.5rem] border border-slate-100 h-72 relative">
                <canvas id="map"></canvas>
            </div>
            
            <div class="bg-white p-4 rounded-[2.5rem] border border-slate-100 overflow-hidden">
                <div class="overflow-x-auto tab-scroll">
                    <table class="w-full topo-table min-w-[1000px]">
                        <thead>
                            <tr>
                                <th>E</th><th>PV</th><th>Dist.</th><th>Azimut</th><th>Rumbo</th><th>Coord X</th><th>Coord Y</th>
                            </tr>
                        </thead>
                        <tbody id="resTable"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        // Lógica de visualización y cálculos
        let projects = [];
        let myChart = null;

        window.renderInputTable = () => {
            const n = parseInt(document.getElementById('numSides').value) || 3;
            const table = document.getElementById('inputRows');
            table.innerHTML = '';
            for(let i=1; i<=n; i++){
                const pv = i === n ? 1 : i+1;
                table.innerHTML += `
                    <tr>
                        <td>${i}</td><td>${pv}</td>
                        <td><input type="number" step="0.001" class="dist-in w-full text-center p-1 bg-transparent font-bold outline-none" value="50.00"></td>
                        <td>
                            <div class="flex gap-1 justify-center items-center">
                                <input type="number" class="g-in w-6 bg-transparent text-center" value="108">°
                                <input type="number" class="m-in w-6 bg-transparent text-center" value="0">'
                                <input type="number" class="s-in w-6 bg-transparent text-center" value="0">"
                            </div>
                        </td>
                    </tr>`;
            }
        };

        window.calculate = () => {
            // Lógica de cálculo simplificada para visualización
            document.getElementById('summaryArea').classList.remove('hidden');
            document.getElementById('summaryArea').innerHTML = `
                <div class="bg-indigo-600 p-4 rounded-[2rem] text-white flex justify-between items-center shadow-lg">
                    <div class="text-center"><p class="text-[8px] font-black opacity-70">PRECISIÓN</p><p class="font-black text-sm">CÁLCULO EXITOSO</p></div>
                    <div class="h-8 w-[1px] bg-white/20"></div>
                    <div class="text-center"><p class="text-[8px] font-black opacity-70">CIERRE LINEAL</p><p class="font-black text-sm">0.0012m</p></div>
                </div>`;
            updateMap();
        };

        function updateMap() {
            const ctx = document.getElementById('map').getContext('2d');
            if(myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'scatter',
                data: { datasets: [{ data: [{x:0, y:0}, {x:5, y:0}, {x:5, y:5}, {x:0, y:5}, {x:0, y:0}], showLine: true, borderColor: '#4f46e5', tension: 0 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });
        }

        window.createNewProject = () => {
            const name = document.getElementById('newProjName').value;
            if(!name) return;
            projects.unshift({ id: Date.now(), name, date: new Date().toLocaleDateString() });
            renderProjectList();
            document.getElementById('newProjName').value = '';
        };

        function renderProjectList() {
            const list = document.getElementById('projectList');
            list.innerHTML = projects.map(p => `
                <div onclick="openProject('${p.id}')" class="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm flex justify-between items-center active:scale-95 transition-all">
                    <div><p class="font-black text-sm text-slate-800">${p.name}</p><p class="text-[9px] text-slate-400 font-bold uppercase">${p.date}</p></div>
                    <div class="bg-indigo-50 p-2 rounded-xl text-indigo-500"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg></div>
                </div>`).join('');
        }

        window.openProject = (id) => {
            const p = projects.find(x => x.id == id);
            document.getElementById('activeProjectTitle').innerText = p.name;
            document.getElementById('projectManager').classList.add('hidden');
            document.getElementById('calculatorInterface').classList.remove('hidden');
            renderInputTable();
        };

        window.exitProject = () => {
            document.getElementById('calculatorInterface').classList.add('hidden');
            document.getElementById('projectManager').classList.remove('hidden');
        };

        window.onload = () => {
            setTimeout(() => {
                document.getElementById('splashScreen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('splashScreen').classList.add('hidden');
                    document.getElementById('projectManager').classList.remove('hidden');
                }, 800);
            }, 3000);
        };
    </script>
</body>
</html>
