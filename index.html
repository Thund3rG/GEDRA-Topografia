<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEDRA | Topografía</title>
    
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="./GEDRA.jpg">

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fadeIn { animation: fadeIn 0.5s ease-in-out; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- Componentes de Iconos ---
        const Icon = ({ name, size = 24, className = "" }) => {
            const [iconSvg, setIconSvg] = useState("");
            useEffect(() => {
                if (window.lucide) {
                    const svg = window.lucide.createIcons();
                }
            }, []);
            return <i data-lucide={name} style={{width: size, height: size}} className={className}></i>;
        };

        // --- Funciones de Ayuda (Tu lógica original) ---
        const gmsToDecimal = (g, m, s) => {
            const gg = parseFloat(g) || 0;
            const mm = parseFloat(m) || 0;
            const ss = parseFloat(s) || 0;
            return gg + mm / 60 + ss / 3600;
        };

        const decimalToGms = (decimal, precisionMode = "Segundo") => {
            if (isNaN(decimal)) return precisionMode === "Segundo" ? "0° 00' 00\"" : "0° 00'";
            const abs = Math.abs(decimal);
            const sign = decimal < 0 ? "-" : "";
            const g = Math.floor(abs + 1e-9);
            const m = Math.floor((abs - g) * 60 + 1e-9);
            if (precisionMode === "Minuto") {
                const mRound = Math.round((abs - g) * 60);
                let finalG = g; let finalM = mRound;
                if (finalM >= 60) { finalG++; finalM = 0; }
                return `${sign}${finalG}° ${String(finalM).padStart(2, '0')}'`;
            }
            const sVal = ((abs - g - m / 60) * 3600);
            const sFinal = Math.abs(sVal).toFixed(2);
            return `${sign}${g}° ${String(m).padStart(2, '0')}' ${String(sFinal).padStart(5, '0').replace(/^0/, '')}"`;
        };

        function App() {
            const [screen, setScreen] = useState('splash');
            const [projects, setProjects] = useState([]);
            const [isCreating, setIsCreating] = useState(false);
            
            const logoUrl = "./GEDRA.jpg"; 

            useEffect(() => {
                const saved = localStorage.getItem('gedra_projects');
                if (saved) setProjects(JSON.parse(saved));
                
                // Pantalla de carga de 2 segundos
                const timer = setTimeout(() => {
                    setScreen('manager');
                    setTimeout(() => window.lucide.createIcons(), 100);
                }, 2000);
                return () => clearTimeout(timer);
            }, []);

            const saveProjects = (newProjects) => {
                setProjects(newProjects);
                localStorage.setItem('gedra_projects', JSON.stringify(newProjects));
            };

            const handleCreateProject = (e) => {
                e.preventDefault();
                const name = e.target.projectName.value;
                const newProject = {
                    id: Date.now().toString(),
                    name,
                    createdAt: new Date().toISOString(),
                    data: []
                };
                saveProjects([newProject, ...projects]);
                setIsCreating(false);
            };

            if (screen === 'splash') {
                return (
                    <div className="h-screen bg-white flex flex-col items-center justify-center p-6 text-center animate-fadeIn">
                        <img src={logoUrl} alt="GEDRA Logo" className="w-64 h-auto mb-8" />
                        <div className="w-48 h-1.5 bg-slate-100 rounded-full overflow-hidden">
                            <div className="h-full bg-yellow-500 animate-[progress_2s_ease-in-out]" style={{width: '100%'}}></div>
                        </div>
                        <p className="mt-4 text-slate-400 font-bold text-xs uppercase tracking-widest">Cargando Herramientas...</p>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-slate-50 text-slate-900 pb-20 font-sans">
                    <header className="bg-[#0f172a] text-white p-6 rounded-b-[2.5rem] shadow-xl flex justify-between items-center sticky top-0 z-40">
                        <div>
                            <h1 className="text-3xl font-black text-yellow-500">GEDRA</h1>
                            <p className="text-slate-400 text-[10px] font-bold uppercase tracking-[0.2em]">Topografía de Precisión</p>
                        </div>
                        <button onClick={() => setIsCreating(true)} className="bg-yellow-500 p-3 rounded-2xl text-slate-900 shadow-lg shadow-yellow-500/20 active:scale-95 transition-transform">
                            <i data-lucide="plus"></i>
                        </button>
                    </header>

                    <main className="p-4 pt-8">
                        {projects.length === 0 ? (
                            <div className="flex flex-col items-center justify-center py-20 text-slate-300">
                                <i data-lucide="clipboard-list" style={{width: 48, height: 48}} className="mb-4"></i>
                                <p className="font-bold">No hay proyectos activos</p>
                            </div>
                        ) : (
                            <div className="grid gap-4">
                                {projects.map(p => (
                                    <div key={p.id} className="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100 flex justify-between items-center">
                                        <div>
                                            <h3 className="font-black text-slate-800">{p.name}</h3>
                                            <p className="text-[10px] text-slate-400 font-bold uppercase">{new Date(p.createdAt).toLocaleDateString()}</p>
                                        </div>
                                        <i data-lucide="chevron-right" className="text-slate-300"></i>
                                    </div>
                                ))}
                            </div>
                        )}
                    </main>

                    {isCreating && (
                        <div className="fixed inset-0 bg-slate-900/90 backdrop-blur-sm flex items-center justify-center p-6 z-50">
                            <form onSubmit={handleCreateProject} className="bg-white w-full max-w-md rounded-[3rem] p-10 space-y-6 shadow-2xl">
                                <h2 className="text-2xl font-black text-slate-800">Nuevo Levantamiento</h2>
                                <input name="projectName" required autoFocus placeholder="Nombre del Proyecto..." className="w-full bg-slate-50 border-2 border-slate-100 p-5 rounded-[2rem] outline-none font-bold focus:border-yellow-500" />
                                <div className="flex gap-3">
                                    <button type="button" onClick={() => setIsCreating(false)} className="flex-1 p-5 font-black text-slate-400 uppercase text-[10px]">Cancelar</button>
                                    <button type="submit" className="flex-[2] p-5 bg-yellow-500 rounded-[2rem] font-black text-slate-900 uppercase text-[10px] shadow-lg shadow-yellow-500/20">Crear</button>
                                </div>
                            </form>
                        </div>
                    ) }
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <script>
        // Registro del Service Worker para modo Offline
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW error:', err));
            });
        }
    </script>
</body>
</html>
