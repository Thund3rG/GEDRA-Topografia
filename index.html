<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GEDRA | Topografía Profesional</title>
    <meta name="theme-color" content="#1a2b3c">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="GEDRA.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
            transition: opacity 0.5s ease;
        }
        .logo-anim { max-width: 220px; animation: breathe 3s infinite; }
        @keyframes breathe { 0%, 100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.05); opacity: 1; } }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="bg-slate-100 text-slate-900 font-sans">

    <div id="splash-screen">
        <img src="GEDRA.jpg" alt="GEDRA" class="logo-anim">
        <p class="mt-4 text-[10px] tracking-[0.5em] text-slate-400 font-bold uppercase">Gedra Precisión</p>
    </div>

    <main class="max-w-4xl mx-auto min-h-screen bg-white shadow-2xl flex flex-col">
        <nav class="bg-[#1a2b3c] p-4 text-white flex justify-between items-center sticky top-0 z-40">
            <div class="flex items-center gap-2">
                <img src="GEDRA.jpg" class="w-8 h-8 rounded-full border border-white/20">
                <span class="font-black tracking-tighter italic">GEDRA | TOPO</span>
            </div>
            <div id="status" class="text-[9px] font-bold bg-green-500 px-2 py-1 rounded shadow-sm">MODO OFFLINE LISTO</div>
        </nav>

        <div class="p-4 space-y-6">
            <section class="bg-slate-50 p-4 rounded-2xl border border-slate-200 grid grid-cols-2 gap-4">
                <div class="col-span-2 text-[10px] font-bold text-slate-400 uppercase tracking-widest">Coordenadas de Estación (BM)</div>
                <input type="number" id="base-x" placeholder="Este (X)" class="p-3 rounded-xl border-none ring-1 ring-slate-200 focus:ring-2 focus:ring-[#b5935a] outline-none">
                <input type="number" id="base-y" placeholder="Norte (Y)" class="p-3 rounded-xl border-none ring-1 ring-slate-200 focus:ring-2 focus:ring-[#b5935a] outline-none">
            </section>

            <section class="space-y-3">
                <div class="flex justify-between items-end">
                    <h3 class="text-lg font-black text-[#1a2b3c]">Lectura de Puntos</h3>
                    <span class="text-[10px] font-bold text-slate-400" id="punto-count">PUNTO #1</span>
                </div>
                <div class="grid grid-cols-12 gap-2">
                    <input type="number" id="in-azimut" placeholder="Azimut (°)" class="col-span-5 p-3 rounded-xl ring-1 ring-slate-200 focus:ring-2 focus:ring-[#1a2b3c] outline-none">
                    <input type="number" id="in-dist" placeholder="Dist (m)" class="col-span-5 p-3 rounded-xl ring-1 ring-slate-200 focus:ring-2 focus:ring-[#1a2b3c] outline-none">
                    <button onclick="agregarPunto()" class="col-span-2 bg-[#b5935a] text-white rounded-xl font-bold text-xl">+</button>
                </div>
            </section>

            <section class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-900 text-white text-[10px] uppercase tracking-wider">
                            <th class="p-3 first:rounded-l-xl">ID</th>
                            <th class="p-3">Azimut</th>
                            <th class="p-3">Distancia</th>
                            <th class="p-3 text-right">Este (X)</th>
                            <th class="p-3 text-right last:rounded-r-xl">Norte (Y)</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-cuerpo" class="text-sm font-mono">
                        </tbody>
                </table>
            </section>
        </div>

        <div class="mt-auto p-4 border-t border-slate-100 flex gap-2">
            <button onclick="limpiarTodo()" class="flex-1 py-3 text-xs font-bold text-slate-400 uppercase tracking-widest">Reiniciar</button>
            <button onclick="exportarCSV()" class="flex-1 py-3 bg-slate-100 rounded-xl text-xs font-bold text-[#1a2b3c] uppercase tracking-widest">Exportar CSV</button>
        </div>

        <footer class="p-4 text-center text-[9px] text-slate-300 font-bold uppercase tracking-[0.4em]">
            Precision Engineering by GEDRA
        </footer>
    </main>

    <script>
        let puntos = [];

        function agregarPunto() {
            const az = parseFloat(document.getElementById('in-azimut').value);
            const dist = parseFloat(document.getElementById('in-dist').value);
            const bx = parseFloat(document.getElementById('base-x').value) || 0;
            const by = parseFloat(document.getElementById('base-y').value) || 0;

            if (isNaN(az) || isNaN(dist)) return;

            const rad = az * (Math.PI / 180);
            const x = bx + (dist * Math.sin(rad));
            const y = by + (dist * Math.cos(rad));

            puntos.push({ id: puntos.length + 1, az, dist, x, y });
            renderTabla();
            
            document.getElementById('in-azimut').value = '';
            document.getElementById('in-dist').value = '';
            document.getElementById('in-azimut').focus();
        }

        function renderTabla() {
            const cuerpo = document.getElementById('tabla-cuerpo');
            cuerpo.innerHTML = puntos.map(p => `
                <tr class="border-b border-slate-50">
                    <td class="p-3 text-slate-400">${p.id}</td>
                    <td class="p-3">${p.az.toFixed(2)}°</td>
                    <td class="p-3">${p.dist.toFixed(2)}m</td>
                    <td class="p-3 text-right font-bold">${p.x.toFixed(3)}</td>
                    <td class="p-3 text-right font-bold">${p.y.toFixed(3)}</td>
                </tr>
            `).join('');
            document.getElementById('punto-count').innerText = `PUNTO #${puntos.length + 1}`;
        }

        function limpiarTodo() {
            if(confirm('¿Borrar todos los datos actuales?')) {
                puntos = [];
                renderTabla();
            }
        }

        // Manejo de Splash Screen
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => splash.style.display = 'none', 500);
            }, 2500);
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
